name: Build Runner

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: linux-arm64
            os: ubuntu-latest
          - runtime: linux-arm
            os: ubuntu-latest
          - runtime: osx-x64
            os: macos-latest
          - runtime: osx-arm64
            os: macos-latest
          - runtime: win-x64
            os: windows-latest
          - runtime: win-arm64
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate runner source exists
        shell: bash
        run: |
          test -f src/ActionsRunner.sln

      - name: Build and package runner
        shell: bash
        run: |
          scripts/build-runner.sh --source-dir "$PWD" --runtime "${{ matrix.runtime }}" --configuration Release --package

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runner-packages-${{ matrix.runtime }}
          path: _package/*
          if-no-files-found: error

  release:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
      branch_slug: ${{ steps.release.outputs.branch_slug }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: runner-packages-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < releaseVersion)
          if [[ -z "${version}" ]]; then
            echo "releaseVersion is empty." >&2
            exit 1
          fi

          branch_slug=$(printf '%s' "${GITHUB_REF_NAME}" | tr '[:upper:]/' '[:lower:]-' | sed -E 's/[^a-z0-9._-]+/-/g; s/^-+|-+$//g')
          release_tag="runner-v${version}-${branch_slug}"
          release_title="Runner v${version} (${GITHUB_REF_NAME})"

          if ! gh release view "${release_tag}" >/dev/null 2>&1; then
            gh release create "${release_tag}" \
              --target "${GITHUB_SHA}" \
              --title "${release_title}" \
              --notes "Patched GitHub Actions runner built from ${GITHUB_REF_NAME} at ${GITHUB_SHA}." \
              --latest=false
          fi

          gh release upload "${release_tag}" release-assets/* --clobber

          printf 'release_tag=%s\n' "${release_tag}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'branch_slug=%s\n' "${branch_slug}" >> "${GITHUB_OUTPUT}"

  publish-image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      RUNNER_DOWNLOAD_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.release.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail

          owner=$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          image_name="${owner}/actions-runner"

          printf 'image_name=%s\n' "${image_name}" >> "${GITHUB_OUTPUT}"
          printf 'version_tag=%s\n' "${{ needs.release.outputs.version }}" >> "${GITHUB_OUTPUT}"
          printf 'branch_tag=%s\n' "v${{ needs.release.outputs.version }}-${{ needs.release.outputs.branch_slug }}" >> "${GITHUB_OUTPUT}"

      - name: Prepare docker build context
        shell: bash
        run: |
          set -euo pipefail

          test -f images/Dockerfile
          perl -0pi -e 's#https://github.com/actions/runner/releases/download/v\$\{RUNNER_VERSION\}#$ENV{RUNNER_DOWNLOAD_BASE}#g' images/Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ./images
          platforms: |
            linux/amd64
            linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.version_tag }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}:${{ steps.image.outputs.branch_tag }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}:latest
          build-args: |
            RUNNER_VERSION=${{ needs.release.outputs.version }}
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release.outputs.release_tag }}

      - name: Generate attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
