name: Build Runner

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build (defaults to the selected branch)
        required: false
        default: ""
        type: string
      release_version:
        description: Optional release version override, for example 2.338.1
        required: false
        default: ""
        type: string
      rebuild_existing_release:
        description: Replace release assets and move the release tag to the rebuilt source commit
        required: false
        default: false
        type: boolean
      update_latest_on_rebuild:
        description: Also move the latest Docker image tag when rebuilding an existing release
        required: false
        default: false
        type: boolean

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            os: ubuntu-latest
          - runtime: linux-arm64
            os: ubuntu-latest
          - runtime: linux-arm
            os: ubuntu-latest
          - runtime: osx-x64
            os: macos-latest
          - runtime: osx-arm64
            os: macos-latest
          - runtime: win-x64
            os: windows-latest
          - runtime: win-arm64
            os: windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Validate runner source exists
        shell: bash
        run: |
          test -f src/ActionsRunner.sln

      - name: Build and package runner
        shell: bash
        run: |
          scripts/build-runner.sh --source-dir "$PWD" --runtime "${{ matrix.runtime }}" --configuration Release --package

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runner-packages-${{ matrix.runtime }}
          path: _package/*
          if-no-files-found: error

  release:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      version: ${{ steps.release.outputs.version }}
      existing_release: ${{ steps.release.outputs.existing_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: runner-packages-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version='${{ inputs.release_version }}'
          if [[ -z "${version}" ]]; then
            version=$(tr -d '[:space:]' < releaseVersion)
          fi
          if [[ -z "${version}" ]]; then
            echo "releaseVersion is empty." >&2
            exit 1
          fi

          release_tag="v${version}"
          release_title="${release_tag}"
          target_commit=$(git rev-parse HEAD)
          release_notes="Patched GitHub Actions runner built from ${target_commit} (source ref: ${{ inputs.source_ref || github.ref_name }})."

          if gh release view "${release_tag}" >/dev/null 2>&1; then
            if [[ '${{ inputs.rebuild_existing_release }}' != 'true' ]]; then
              echo "Release ${release_tag} already exists. Enable rebuild_existing_release to replace its assets." >&2
              exit 1
            fi
            echo "Rebuilding existing release ${release_tag}; uploaded assets will be replaced."
            existing_release=true
          else
            gh release create "${release_tag}" \
              --target "${target_commit}" \
              --title "${release_title}" \
              --notes "${release_notes}" \
              --latest=false
            existing_release=false
          fi

          gh release upload "${release_tag}" release-assets/* --clobber

          if [[ "${existing_release}" == "true" ]]; then
            # Replacing assets alone leaves GitHub's source archives attached to the old tag commit.
            git tag --force "${release_tag}" "${target_commit}"
            git push --force origin "refs/tags/${release_tag}"
            gh release edit "${release_tag}" \
              --target "${target_commit}" \
              --title "${release_title}" \
              --notes "${release_notes}"
          fi

          published_tag_commit=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${release_tag}" --jq '.object.sha')
          if [[ "${published_tag_commit}" != "${target_commit}" ]]; then
            echo "Release tag ${release_tag} points to ${published_tag_commit}, expected ${target_commit}." >&2
            exit 1
          fi

          expected_asset_count=$(find release-assets -maxdepth 1 -type f | wc -l)
          published_assets=$(gh release view "${release_tag}" --json assets --jq '.assets[].name')
          published_asset_count=$(printf '%s\n' "${published_assets}" | sed '/^$/d' | wc -l)
          if [[ "${published_asset_count}" -lt "${expected_asset_count}" ]]; then
            echo "Release ${release_tag} has ${published_asset_count} assets; expected at least ${expected_asset_count}." >&2
            exit 1
          fi
          for asset_path in release-assets/*; do
            asset_name=${asset_path##*/}
            if ! grep -Fxq "${asset_name}" <<<"${published_assets}"; then
              echo "Release ${release_tag} is missing rebuilt asset ${asset_name}." >&2
              exit 1
            fi
          done

          echo "Release ${release_tag} now points to ${target_commit} and has ${published_asset_count} assets."

          printf 'release_tag=%s\n' "${release_tag}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'existing_release=%s\n' "${existing_release}" >> "${GITHUB_OUTPUT}"

  publish-image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      RUNNER_DOWNLOAD_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ needs.release.outputs.release_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail

          image_name=$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')

          printf 'image_name=%s\n' "${image_name}" >> "${GITHUB_OUTPUT}"
          printf 'version_tag=%s\n' "${{ needs.release.outputs.version }}" >> "${GITHUB_OUTPUT}"
          printf 'release_tag=%s\n' "v${{ needs.release.outputs.version }}" >> "${GITHUB_OUTPUT}"

          tags="${REGISTRY}/${image_name}:${{ needs.release.outputs.version }}"
          tags+=$'\n'"${REGISTRY}/${image_name}:v${{ needs.release.outputs.version }}"
          if [[ '${{ needs.release.outputs.existing_release }}' != 'true' || '${{ inputs.update_latest_on_rebuild }}' == 'true' ]]; then
            tags+=$'\n'"${REGISTRY}/${image_name}:latest"
          fi
          printf 'tags<<EOF\n%s\nEOF\n' "${tags}" >> "${GITHUB_OUTPUT}"

      - name: Prepare docker build context
        shell: bash
        run: |
          set -euo pipefail

          test -f images/Dockerfile
          perl -0pi -e 's#https://github.com/actions/runner/releases/download/v\$\{RUNNER_VERSION\}#$ENV{RUNNER_DOWNLOAD_BASE}#g' images/Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: ./images
          platforms: |
            linux/amd64
            linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            RUNNER_VERSION=${{ needs.release.outputs.version }}
          push: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.release.outputs.release_tag }}

      - name: Generate attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.image.outputs.image_name }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
